x-payment-service-env: &payment-service-env
  NODE_ENV: production
  PORT: "3000"
  GRPC_URL: "0.0.0.0:5000"
  GRPC_PACKAGE: "payment"
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
  PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
  PAYSTACK_WEBHOOK_PATH: "/webhooks/paystack"
  PAYSTACK_WEBHOOK_IP_ALLOWLIST: ${PAYSTACK_WEBHOOK_IP_ALLOWLIST:-}
  PAYSTACK_WEBHOOK_IP_ALLOWLIST_ENABLED: ${PAYSTACK_WEBHOOK_IP_ALLOWLIST_ENABLED:-false}
  DATABASE_URL: postgresql://payment_user:${POSTGRES_PASSWORD:-payment_pass}@postgres:5432/payment_service?schema=public
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_EXCHANGE: "payment.events"
  RABBITMQ_EXCHANGE_TYPE: "topic"
  GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET}
  GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
  THROTTLE_TTL_MS: "60000"
  THROTTLE_LIMIT: "30"
  WEBHOOK_THROTTLE_TTL_MS: "60000"
  WEBHOOK_THROTTLE_LIMIT: "60"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECRETS_PROVIDER: ${SECRETS_PROVIDER:-env}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_pass}
      POSTGRES_DB: payment_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - payment-net

  payment-service-migrate:
    build:
      context: ./payment-service
      target: build
    environment:
      <<: *payment-service-env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-net

  payment-service:
    build:
      context: ./payment-service
      target: runtime
    restart: unless-stopped
    environment:
      <<: *payment-service-env
    ports:
      - "3000:3000" # HTTP (webhooks, health)
      - "5000:5000" # gRPC
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - payment-net

networks:
  payment-net:
    driver: bridge

volumes:
  postgres_data:
